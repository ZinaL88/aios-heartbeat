<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heartbeat · Kanban</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111512;color:#edf3ed}
    body{margin:0}main{padding:24px}h1{margin:0 0 8px}a{color:#c8ff72}#load-status,.age,.empty{color:#aab8ac;font-size:.85rem}
    #kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:16px;overflow-x:auto;padding:12px 0}
    .column{background:#19211b;border:1px solid #344437;border-radius:12px;padding:12px;min-width:0}
    h2{font-size:1rem;margin:0 0 16px}h2 span{float:right;color:#b8dc9a}.card{background:#222d25;border:1px solid #425547;border-radius:8px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere}
    h3{font-size:1rem;margin:0 0 12px}.card p{line-height:1.5;margin:8px 0}.owner{color:#d0e9b4;font-size:.85rem}
    @media(max-width:600px){main{padding:16px}#kanban{grid-template-columns:1fr}}
  </style>
  <script src="aios-nav.js" defer></script>
  <script src="kanban.js" defer></script>
</head>
<body><main>
  <h1>Heartbeat Kanban</h1>
  <p>Open tasks, grouped by status. <a href="index.html">Heartbeat home</a></p>
  <p id="load-status" role="status" aria-live="polite">Loading open_tasks.json…</p>
  <div id="kanban"></div>
  <noscript>Enable JavaScript to display the open-task board.</noscript>
</main></body>
</html>
