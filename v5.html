<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>HEARTBEAT</title>
<style>
:root { --bg:#0f1210; --fg:#e8ebe6; --muted:#9aa39a; --live:#3dd68c; --accent:#c4f542; --card:#161a16; }
* { box-sizing:border-box; }
html,body { pointer-events:auto; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system,system-ui,sans-serif;
  padding:20px; padding-bottom:48px; padding-top:max(20px,env(safe-area-inset-top)); }
h1 { font-size:13px; letter-spacing:.12em; margin:0; font-weight:700; }
h2 { font-size:12px; letter-spacing:.1em; color:var(--muted); font-weight:700; margin:0; }
.mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--muted); }
.row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
.card { margin-top:26px; padding-top:18px; border-top:1px solid #222; }
.dot { width:8px; height:8px; border-radius:99px; display:inline-block; background:#555; margin-right:8px; }
.dot.on { background:var(--live); }
.big { font-size:34px; font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-.03em; margin:8px 0 0; }
.ch { font-size:17px; font-weight:500; margin:8px 0 0; }
ol { margin:8px 0 0; padding-left:0; list-style:none; }
li { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #1c1c1c; align-items:center; }
.n { width:18px; color:var(--muted); font-family:ui-monospace,Menlo,monospace; font-size:12px; }
.mv { display:flex; flex-direction:column; gap:2px; }
button { pointer-events:auto; position:relative; z-index:3; }
.mv button { min-width:40px; min-height:28px; background:#222; color:var(--fg); border:0; border-radius:6px; font-size:12px; }
.edit-only { display:none; width:100%; margin-top:6px; }
body.editing .edit-only { display:block; }
body.editing .txt { display:none; }
.nm, .uc { display:block; width:100%; margin:4px 0; background:#1a1a1a; color:var(--fg); border:1px solid #333; border-radius:6px; padding:6px 8px; min-height:36px; }
.skl { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:6px 0; }
.rm { background:transparent; color:#c47a72; border:0; min-height:36px; padding:0 8px; }
.tabs { display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; }
.tabs button { min-height:40px; background:#1a1a1a; color:var(--fg); border:1px solid #333; border-radius:8px; padding:8px 12px; }
.tabs button.on { background:#c8f542; color:#111; }
#editBtn, #saveBtn, #addCh { min-width:88px; min-height:44px; background:#1a1a1a; color:var(--fg); border:1px solid #333; border-radius:8px; padding:8px 12px; }
#addCh, #editTools { display:none; }
body.editing #addCh, body.editing #editTools { display:block; }
.overdue { color:#e07070; }
</style>
</head><body>
<h1>HEARTBEAT</h1>
<p class="mono" id="ping">opening… numbers from last ping, buttons work now</p>
<div class="card">
  <div class="row"><h2><span class="dot" id="capDot"></span>CAPTIONS</h2><span class="mono" id="capState">—</span></div>
  <p class="ch" id="capCh">—</p>
  <div class="row"><span class="big" id="capNum">—</span><span class="mono" id="capHint"></span></div>
  <p class="ch" id="capEta">ETA —</p>
</div>
<div class="card">
  <div class="row"><h2><span class="dot" id="sttDot"></span>STT</h2><span class="mono" id="sttState">—</span></div>
  <p class="ch" id="sttCh">—</p>
  <div class="row"><span class="big" id="sttNum">—</span><span class="mono" id="sttHint"></span></div>
  <p class="ch" id="sttEta">ETA —</p>
</div>
<div class="card">
  <h2>BOX</h2>
  <p class="ch" id="ram">RAM —</p>
</div>
<div class="card">
  <div class="row"><h2>QUEUE</h2>
    <button type="button" id="editBtn">Edit</button></div>
  <div class="tabs" id="qTabs">
    <button type="button" id="tab-ch" class="on">Channels</button>
    <button type="button" id="tab-tk">Tasks</button>
  </div>
  <ol id="channels"></ol>
  <ol id="playlists" hidden></ol>
  <div id="editTools">
    <button type="button" id="addCh">Add channel</button>
    <button type="button" id="saveBtn">Save to git</button>
    <p class="mono" id="saveState">Grip works without Edit. Edit = add/remove/skip.</p>
  </div>
</div>
<p class="mono" id="src" style="margin-top:28px">v5 · same-origin status.json · no overlay</p>
<script>
(function(){
function $(id){return document.getElementById(id);}
var NAMES={UC_5lJHgnMP_lb_VpIiXV0hQ:"#11 课代表立正",UCJAPsTtcJJWGk8e-_CJL8TQ:"一个狠人",UCGWYKICLOE8Wxy7q3eYXmPA:"bestpartners",UCPpdGTNbIKdiWgxCrbka4Zw:"huanyihe777",UCAxQ8sjHgjXh26la7jEBw3w:"mike1111",UCeTLfPD7thTMabtL7w87Aug:"清流君",UCP76ZVB1x9udP2UFcQkSvMA:"大卢和小田",UCROR3SZDrohSela1sjD1STg:"王理元",UCaIIFXfdQUYf3OHPIFNDdrQ:"Alan",UCaA2cfCpytaARHcNcApboSw:"麥克老李"};
function title(id){return NAMES[id]||id||"—";}
function paint(d){
  try{
    var tr=(d.collector&&d.collector.tracks)||{};
    var cap=tr.captions||{}, stt=tr.stt||{};
    $("ping").textContent=(d.written_at_hkt||"—");
    $("capDot").className="dot"+(cap.running?" on":"");
    $("capState").textContent=cap.running?"running":"idle";
    $("capCh").textContent=cap.running?title(cap.channel_id):(cap.next_name||"idle");
    $("capNum").textContent=String(cap.left!=null?cap.left:0);
    $("capHint").textContent=cap.no_sub? (cap.no_sub+" no-sub"): ((cap.jobs||2)+" workers");
    var capEta=cap.eta_hkt?("ETA "+cap.eta_hkt):(cap.running?"ETA calculating":"ETA —");
    $("capEta").textContent=capEta;
    $("capEta").className="ch"+(cap.overdue?" overdue":"");
    $("sttDot").className="dot"+(stt.running?" on":"");
    $("sttState").textContent=stt.running?"running":"idle";
    $("sttCh").textContent=title(stt.channel_id);
    $("sttNum").textContent=String(stt.pending||0);
    $("sttHint").textContent=stt.inflight?("file "+stt.inflight):"";
    $("sttEta").textContent=stt.eta_hkt?("ETA "+stt.eta_hkt):"ETA —";
    $("sttEta").className="ch"+(stt.overdue?" overdue":"");
    var res=d.resources||{};
    $("ram").textContent="RAM free "+(res.mem_available_gi!=null?res.mem_available_gi:"—")+" of "+(res.mem_total_gi!=null?res.mem_total_gi:"—")+"G · load "+(res.load1!=null?res.load1:"—");
    $("src").textContent="live · no page reload";
  }catch(e){ $("ping").textContent="paint ok-fail "+e; }
}
function getJson(url){
  return new Promise(function(resolve,reject){
    var x=new XMLHttpRequest();
    x.open("GET", url, true);
    x.timeout=2500;
    x.onload=function(){
      if(x.status>=200 && x.status<300){
        try{ resolve(JSON.parse(x.responseText)); }catch(e){ reject(e); }
      } else reject(x.status);
    };
    x.ontimeout=function(){ reject("timeout"); };
    x.onerror=function(){ reject("net"); };
    x.send();
  });
}
function pull(){
  var t="?t="+Date.now();
  getJson("status.json"+t).then(function(d){
    try{ localStorage.setItem("aios-hb-v1", JSON.stringify(d)); }catch(e){}
    paint(d);
  }).catch(function(){
    getJson("https://cdn.jsdelivr.net/gh/ZinaL88/aios-heartbeat@main/status.json"+t).then(function(d){
      try{ localStorage.setItem("aios-hb-v1", JSON.stringify(d)); }catch(e){}
      paint(d);
    }).catch(function(){
      $("ping").textContent=($("ping").textContent||"")+" · fetch miss, UI still live";
    });
  });
}
function toggleEdit(){
  document.body.classList.toggle("editing");
  $("editBtn").textContent=document.body.classList.contains("editing")?"Done":"Edit";
}
function qtab(id){
  document.querySelectorAll("#qTabs button").forEach(function(b){ b.classList.remove("on"); });
  var btn=$("tab-"+id); if(btn) btn.classList.add("on");
  $("channels").hidden = (id!=="ch");
  $("playlists").hidden = (id==="ch");
}
$("editBtn").onclick=toggleEdit;
$("tab-ch").onclick=function(){ qtab("ch"); };
$("tab-tk").onclick=function(){ qtab("tk"); };
$("addCh").onclick=function(){
  var li=document.createElement("li");
  li.innerHTML='<span class="mv"><button type="button">▲</button><button type="button">▼</button></span><span class="n">+</span><div class="txt"><b>new</b></div><div class="edit-only"><input class="nm" placeholder="name"/><input class="uc" placeholder="UC…"/><label class="skl"><input type="checkbox" class="sk"/> skip</label></div>';
  $("channels").appendChild(li);
};
$("channels").addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  var li=b.closest("li"); if(!li) return;
  if(b.textContent==="▲" && li.previousElementSibling) li.parentNode.insertBefore(li, li.previousElementSibling);
  if(b.textContent==="▼" && li.nextElementSibling) li.parentNode.insertBefore(li.nextElementSibling, li);
});
try{ var c=localStorage.getItem("aios-hb-v1"); if(c) paint(JSON.parse(c)); }catch(e){}
pull();
setInterval(pull, 15000);
})();
</script>
</body></html>
