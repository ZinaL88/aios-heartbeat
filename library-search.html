<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>HEARTBEAT · Library search</title>
<style>
:root { --bg:#0e0e0e; --card:#1a1a1a; --fg:#f0f0f0; --muted:#8a8a8a; --lime:#c8f542; --amber:#e8b84a; --red:#f07178; --border:#2a2a2a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; padding:16px; padding-bottom:64px; }
h1 { font-size:17px; letter-spacing:.1em; margin:0; }
.mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px; color:var(--muted); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:12px; }
input, select { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#111; color:var(--fg); font-size:16px; }
label { display:block; font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin:10px 0 6px; font-weight:700; }
.filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
@media (max-width:600px){ .filters { grid-template-columns:1fr; } }
a.btn, button.btn { display:inline-flex; padding:10px 14px; border-radius:999px; border:0; background:var(--lime); color:#111; font-weight:600; text-decoration:none; font-size:14px; cursor:pointer; }
a.btn.secondary, button.btn.secondary { background:#222; color:var(--fg); border:1px solid #333; }
.hit { padding:12px 0; border-bottom:1px solid #222; }
.hit h3 { margin:0 0 4px; font-size:15px; font-weight:600; }
.hit .meta { color:var(--muted); font-size:12px; }
.bad { color:var(--red); font-size:12px; }
.ok { color:var(--lime); }
.warn { color:var(--amber); }
#status { color:var(--muted); font-size:13px; margin-top:8px; }
#detail { display:none; }
#detail.open { display:block; }
pre.fields { white-space:pre-wrap; word-break:break-word; font-size:12px; margin:0; font-family:ui-monospace,Menlo,monospace; }
.field-miss { color:var(--red); }
</style>
</head>
<body>
<header class="row">
  <div>
    <h1>HEARTBEAT · Search</h1>
    <p class="mono" id="status">Loading catalog…</p>
  </div>
  <a class="btn secondary" href="./library.html">← Library</a>
</header>

<section class="card">
  <label for="q">Search</label>
  <input id="q" type="search" placeholder="Title, channel, id…" autocomplete="off" enterkeyhint="search"/>
  <div class="filters">
    <div>
      <label for="channel">Channel</label>
      <select id="channel"><option value="">All</option></select>
    </div>
    <div>
      <label for="access">Access</label>
      <select id="access">
        <option value="">All</option>
        <option value="public">public</option>
        <option value="members">members</option>
      </select>
    </div>
    <div>
      <label for="ctype">Type</label>
      <select id="ctype">
        <option value="">All</option>
        <option value="video">video</option>
        <option value="short">short</option>
        <option value="post">post</option>
        <option value="live">live</option>
      </select>
    </div>
    <div>
      <label for="tx">Transcript</label>
      <select id="tx">
        <option value="">All</option>
        <option value="1">Has transcript</option>
        <option value="0">No transcript</option>
      </select>
    </div>
  </div>
  <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;margin-top:12px;">
    <input id="gapsOnly" type="checkbox"/> Schema problems only
  </label>
  <div style="margin-top:12px">
    <button class="btn" id="go" type="button">Search</button>
  </div>
</section>

<section class="card">
  <p class="mono" id="count">—</p>
  <div id="results"></div>
</section>

<section class="card" id="detail">
  <div class="row">
    <p class="hlabel" style="margin:0;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;text-transform:uppercase;">Item detail / schema</p>
    <button class="btn secondary" type="button" id="closeDetail">Close</button>
  </div>
  <pre class="fields" id="detailBody"></pre>
</section>

<script>
(function(){
  let CATALOG = [];
  const $ = (id) => document.getElementById(id);

  async function fetchJson(url){
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) throw new Error(url + " HTTP " + r.status);
    return r.json();
  }

  async function loadCatalog(){
    // Phone path ONLY: small metadata shards. Never gzip / never 17MB blob.
    const man = await fetchJson("./library_phone.json");
    if(!man || !man.sharded || !Array.isArray(man.shards) || !man.shards.length){
      throw new Error("library_phone.json missing shards");
    }
    const parts = [];
    for(const name of man.shards){
      $("status").textContent = "Loading " + name + "…";
      const part = await fetchJson("./" + name);
      if(Array.isArray(part)) parts.push(...part);
    }
    return {items: parts, note: "phone shards×" + man.shards.length};
  }

  function fillChannels(){
    const names = new Map();
    CATALOG.forEach(it => {
      const id = it.channel_id || "";
      if(!id) return;
      if(!names.has(id)) names.set(id, it.channel_name || id);
    });
    const sel = $("channel");
    sel.innerHTML = '<option value="">All</option>';
    [...names.entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),"zh")).forEach(([id,name])=>{
      const o = document.createElement("option");
      o.value = id; o.textContent = name;
      sel.appendChild(o);
    });
  }

  function matches(it, q){
    if(!q) return true;
    const blob = [it.title, it.channel_name, it.id, it.channel_id, it.missing_flags].join(" ").toLowerCase();
    return q.split(/\s+/).filter(Boolean).every(tok => blob.includes(tok));
  }

  function run(){
    const q = ($("q").value || "").trim().toLowerCase();
    const ch = $("channel").value;
    const access = $("access").value;
    const ctype = $("ctype").value;
    const tx = $("tx").value;
    const gapsOnly = $("gapsOnly").checked;
    const hits = [];
    for(const it of CATALOG){
      if(ch && it.channel_id !== ch) continue;
      if(access && it.access !== access) continue;
      if(ctype && it.content_type !== ctype) continue;
      if(tx === "1" && !it.has_transcript) continue;
      if(tx === "0" && it.has_transcript) continue;
      if(gapsOnly && !it.has_schema_gap) continue;
      if(!matches(it, q)) continue;
      hits.push(it);
      if(hits.length >= 80) break;
    }
    $("count").textContent = hits.length + (hits.length>=80 ? "+ showing first 80" : "") + " · catalog " + CATALOG.length;
    $("results").innerHTML = hits.length ? hits.map((it,i)=>`
      <div class="hit" data-i="${i}">
        <h3>${escapeHtml(it.title || "(no title)")}</h3>
        <div class="meta">${escapeHtml(it.channel_name||it.channel_id||"")} · ${escapeHtml(it.access||"?")} · ${escapeHtml(it.content_type||"?")} · ${it.has_transcript?"transcript":"no transcript"}</div>
        ${it.has_schema_gap ? `<div class="bad">schema: ${escapeHtml(it.missing_flags||"gap")}</div>` : ""}
        <div style="margin-top:8px"><button class="btn secondary open" type="button" data-i="${i}">Schema fields</button>
        ${it.url ? `<a class="btn secondary" href="${escapeAttr(it.url)}" target="_blank" rel="noopener">YouTube</a>` : ""}</div>
      </div>`).join("") : '<p class="warn">No matches.</p>';
    $("results")._hits = hits;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s).replace(/`/g,''); }

  function showDetail(it){
    const required = ['id','channel_id','channel_name','title','url','access','content_type'];
    const lines = [];
    for(const k of Object.keys(it)){
      const v = it[k];
      const miss = required.includes(k) && (v===null||v===undefined||v==='');
      lines.push((miss?'⚠ ':'  ') + k + ': ' + JSON.stringify(v));
    }
    const missing = required.filter(k => it[k]===null||it[k]===undefined||it[k]==='');
    $("detailBody").innerHTML = (missing.length ? '<span class="field-miss">Missing required: '+escapeHtml(missing.join(', '))+'</span>\n\n' : '<span class="ok">Required fields present in phone catalog</span>\n\n') + escapeHtml(lines.join('\n'));
    $("detail").classList.add('open');
    $("detail").scrollIntoView({behavior:'smooth', block:'start'});
  }

  $("go").addEventListener('click', run);
  $("q").addEventListener('keydown', e => { if(e.key==='Enter') run(); });
  ["channel","access","ctype","tx","gapsOnly"].forEach(id => $(id).addEventListener('change', run));
  $("results").addEventListener('click', e => {
    const btn = e.target.closest('button.open');
    if(!btn) return;
    const hits = $("results")._hits || [];
    showDetail(hits[+btn.dataset.i]);
  });
  $("closeDetail").addEventListener('click', () => $("detail").classList.remove('open'));

  (async function(){
    try {
      const {items, note} = await loadCatalog();
      CATALOG = items;
      fillChannels();
      $("status").textContent = "Ready · " + items.length + " items · " + note;
      run();
    } catch(err){
      $("status").innerHTML = '<span class="warn">Load failed: '+escapeHtml(err.message)+'</span>';
    }
  })();
})();
</script>
</body>
</html>
