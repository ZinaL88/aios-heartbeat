<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>HEARTBEAT</title>
  <style>
    :root { --bg:#0f1210; --fg:#e8ebe6; --muted:#9aa39a; --subtle:#6b736b; --live:#3dd68c; --bar:#2a2f2a; --accent:#c4f542; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.4 -apple-system, system-ui, sans-serif; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
    h1 { font-size: 14px; letter-spacing: .08em; margin: 0; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
    .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top: 8px; }
    .bar { height: 8px; background: var(--bar); border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .bar > i { display:block; height:100%; background: var(--accent); }
    .live { color: var(--live); }
    .card { margin-top: 20px; padding-top: 16px; border-top: 1px solid #222; }
    .dot { width:8px; height:8px; border-radius:99px; display:inline-block; background:#555; margin-right:6px; }
    .dot.on { background: var(--live); box-shadow: 0 0 8px var(--live); }
    .big { font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 600; }
    .warn { color: #e8b84a; }
  </style>
</head>
<body>
  <div class="row">
    <h1>HEARTBEAT</h1>
    <span id="age" class="mono">…</span>
  </div>
  <p id="ping" class="mono">loading status.json</p>
  <div class="card">
    <div class="row"><span class="mono">ALL LEFT</span><span id="allEta" class="mono"></span></div>
    <p class="big" id="allNum">—</p>
    <div class="bar"><i id="allBar" style="width:0%"></i></div>
  </div>
  <div class="card" id="cap">
    <div class="row"><span class="mono"><span class="dot" id="capDot"></span>CAPTIONS</span><span id="capState" class="mono">—</span></div>
    <p id="capCh"></p>
    <div class="row"><span class="big" id="capNum">—</span><span id="capEta" class="mono"></span></div>
    <div class="bar"><i id="capBar" style="width:0%"></i></div>
  </div>
  <div class="card" id="stt">
    <div class="row"><span class="mono"><span class="dot" id="sttDot"></span>STT</span><span id="sttState" class="mono">—</span></div>
    <p id="sttCh"></p>
    <div class="row"><span class="big" id="sttNum">—</span><span id="sttEta" class="mono"></span></div>
    <div class="bar"><i id="sttBar" style="width:0%"></i></div>
  </div>
  <p id="ram" class="mono" style="margin-top:24px"></p>
  <p class="mono">Read-only. Public ping only. Refresh 20s. Add to Home Screen.</p>
<script>
const NAMES = {
  UC_5lJHgnMP_lb_VpIiXV0hQ: "#11 课代表立正",
  UCJAPsTtcJJWGk8e-_CJL8TQ: "一个狠人",
  UCGWYKICLOE8Wxy7q3eYXmPA: "bestpartners",
  UCPpdGTNbIKdiWgxCrbka4Zw: "huanyihe777",
  UCAxQ8sjHgjXh26la7jEBw3w: "mike1111",
  UCeTLfPD7thTMabtL7w87Aug: "清流君",
  UCP76ZVB1x9udP2UFcQkSvMA: "大卢和小田",
  UCROR3SZDrohSela1sjD1STg: "王理元",
  UCaIIFXfdQUYf3OHPIFNDdrQ: "Alan",
};
function title(id){ return NAMES[id] || id || "—"; }
function eta(min){
  if (min == null) return "—";
  if (min <= 0) return "done";
  if (min < 60) return "~" + min + "m";
  return "~" + Math.floor(min/60) + "h " + (min%60) + "m";
}
function ageLabel(utc){
  if (!utc) return "no ping";
  const s = (Date.now() - Date.parse(utc)) / 1000;
  if (s < 90) return "LIVE " + Math.round(s) + "s";
  if (s < 720) return Math.round(s/60) + "m old";
  return "STALE " + Math.round(s/60) + "m";
}
async function pull(){
  const r = await fetch("https://raw.githubusercontent.com/ZinaL88/aios-heartbeat/main/status.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  const d = await r.json();
  const tr = (d.collector && d.collector.tracks) || {};
  const cap = tr.captions || {};
  const stt = tr.stt || {};
  const capDone = cap.done ?? 0, capLeft = cap.left ?? 0, capTot = cap.total || (capDone+capLeft);
  const sttPend = stt.pending ?? 0;
  const allLeft = (capLeft||0) + sttPend;
  document.getElementById("ping").textContent = (d.written_at_hkt || "—") + " · head " + (d.repo_head || "");
  document.getElementById("age").textContent = ageLabel(d.written_at_utc);
  document.getElementById("age").className = "mono " + ((Date.now()-Date.parse(d.written_at_utc))/1000 < 720 ? "live" : "warn");
  document.getElementById("allNum").textContent = allLeft + " left";
  document.getElementById("allEta").textContent = eta((cap.eta_min||0)+(stt.eta_min||0));
  document.getElementById("capDot").className = "dot" + (cap.running ? " on" : "");
  document.getElementById("capState").textContent = cap.running ? "running" : "idle";
  document.getElementById("capCh").textContent = title(cap.channel_id);
  document.getElementById("capNum").textContent = capTot ? (capDone + " / " + capTot) : "—";
  document.getElementById("capEta").textContent = (capLeft != null ? capLeft + " left · " : "") + eta(cap.eta_min);
  document.getElementById("capBar").style.width = (capTot ? Math.min(99, capDone/capTot*100) : 0) + "%";
  document.getElementById("sttDot").className = "dot" + (stt.running ? " on" : "");
  document.getElementById("sttState").textContent = stt.running ? "running" : "idle";
  document.getElementById("sttCh").textContent = title(stt.channel_id);
  document.getElementById("sttNum").textContent = sttPend + " pending";
  document.getElementById("sttEta").textContent = eta(stt.eta_min);
  const sttTot = sttPend + 1;
  document.getElementById("sttBar").style.width = stt.running ? "12%" : (sttPend ? "4%" : "100%");
  const res = d.resources || {};
  document.getElementById("ram").textContent = "RAM avail " + (res.mem_available_gi ?? "—") + "G / " + (res.mem_total_gi ?? "—") + "G · load " + (res.load1 ?? "—");
}
pull();
setInterval(pull, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
</script>
</body>
</html>
