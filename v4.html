<style>
:root { --bg:#0f1210; --fg:#e8ebe6; --muted:#9aa39a; --live:#3dd68c; --bar:#2a2f2a; --accent:#c4f542; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system,system-ui,sans-serif; padding:20px; padding-top:max(20px,env(safe-area-inset-top)); }

.row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-top:8px; }

.big { font-size:34px; font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-.03em; }
.label { font-size:12px; letter-spacing:.08em; color:var(--muted); font-weight:600; }
.ch { font-size:17px; font-weight:500; margin:8px 0 0; }
